<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Private Mix Vault</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-color: #c5a059;
            --text-muted: #858585;
            --accent: #10b981; /* Neon green */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
        }

        /* Playlist Styles */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .track-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-card:hover {
            transform: translateY(-2px);
            border-color: #334155;
        }

        .track-card.active {
            border-color: var(--accent);
            background: linear-gradient(145deg, #1f2833, #111827);
        }

        .track-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .track-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .play-icon {
            color: var(--text-muted);
            font-size: 1.5rem;
        }

        .track-card.active .play-icon {
            color: var(--accent);
        }

        /* Persistent Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #111827;
            border-top: 1px solid #374151;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }

        .player-bar .now-playing {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--accent);
            font-weight: bold;
            text-align: center;
        }

        audio {
            width: 100%;
            max-width: 500px;
            accent-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>The Mix Vault</h1>
            <p>Lossless Archive • Stream or Download</p>
        </header>

        <div class="track-list" id="playlist">
            </div>
    </div>

    <div class="player-bar">
        <div class="now-playing" id="now-playing-title">Select a mix to stream lossless...</div>
        <audio id="audio-player" controls preload="metadata"></audio>
    </div>

    <script>
        // ==========================================
        // 🛠️ MIX CONFIGURATION
        // ==========================================
        // 1. Upload your mix to Google Drive.
        // 2. Set file sharing to "Anyone with the link can view".
        // 3. Grab the File ID from the share link and paste it below.
        // (Example link: https://drive.google.com/file/d/YOUR_FILE_ID/view)
        
        const mixes = [
            {
                title: "Anthony Pappa - Selador Selected Works 2021 DJ Mix",
                date: "Dec 2021",
                duration: "3h 54m",
                streamUrl: "https://f004.backblazeb2.com/file/clevetunes/Anthony%20Pappa%20-%20Selador%20Selected%20Works%202021%20DJ%20Mix.wav"
            }
        ];

        // ==========================================
        // PLAYER CORE LOGIC
        // ==========================================
        const playlistContainer = document.getElementById('playlist');
        const audioPlayer = document.getElementById('audio-player');
        const nowPlayingTitle = document.getElementById('now-playing-title');

        // Render the playlist
        mixes.forEach((mix, index) => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.dataset.index = index;
            card.innerHTML = `
                <div class="track-info">
                    <h3>${mix.title}</h3>
                    <p>${mix.date} • ${mix.duration}</p>
                </div>
                <div class="play-icon">▶</div>
            `;
            
            card.addEventListener('click', () => playMix(index));
            playlistContainer.appendChild(card);
        });

        function playMix(index) {
            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));

            const selectedCard = playlistContainer.children[index];
            selectedCard.classList.add('active');

            const mix = mixes[index];
            nowPlayingTitle.textContent = `Playing: ${mix.title}`;
            audioPlayer.src = mix.streamUrl;
            audioPlayer.play();
        }
    </script>
</body>
</html>
