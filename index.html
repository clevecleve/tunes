<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jase's House of Cheese</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0b0c10;
            --surface: #1a1d27;
            --surface2: #22263a;
            --accent: #10b981;
            --accent-dim: rgba(16,185,129,0.15);
            --text: #e2e8f0;
            --muted: #64748b;
            --error: #f87171;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 520px; width: 100%; }

        header { text-align: center; margin-bottom: 40px; }

        header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        header p { color: var(--muted); font-size: 0.85rem; }

        .track-list { display: flex; flex-direction: column; gap: 12px; }

        .track-card {
            background: var(--surface);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: border-color 0.2s, background 0.2s;
        }

        .track-card:hover { border-color: #334155; }

        .track-card.active {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .track-card.error { border-color: var(--error); }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
            color: var(--muted);
            transition: background 0.2s, color 0.2s;
        }

        .track-card.active .play-btn {
            background: var(--accent);
            color: #fff;
        }

        .track-card.error .play-btn { background: var(--error); color: #fff; }

        .track-info { flex: 1; min-width: 0; }

        .track-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .track-info p { font-size: 0.8rem; color: var(--muted); }

        .track-blurb {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.5;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2d3748;
            display: none;
        }

        .track-card.active .track-blurb { display: block; }

        /* Player bar */
        .player-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #111827;
            border-top: 1px solid #1e293b;
            padding: 16px 24px 20px;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
        }

        .player-inner {
            max-width: 520px;
            margin: 0 auto;
        }

        .player-title {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-title.idle { color: var(--muted); font-weight: 400; }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            line-height: 1;
            flex-shrink: 0;
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .ctrl-btn:hover { opacity: 1; }
        .ctrl-btn:disabled { opacity: 0.3; cursor: default; }

        .ctrl-btn.primary {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .ctrl-btn.primary:hover { filter: brightness(1.15); }

        .progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }

        .progress-bar-track {
            width: 100%;
            height: 4px;
            background: #2d3748;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
            transition: width 0.3s linear;
        }

        .progress-bar-track:hover .progress-bar-fill { background: #34d399; }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 70px;
            height: 4px;
            background: #2d3748;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .status-msg {
            font-size: 0.75rem;
            margin-top: 6px;
            color: var(--error);
            min-height: 1em;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Jase's House of Cheese</h1>
        <p>Always overpromising and underdelivering</p>
    </header>
    <div class="track-list" id="playlist"></div>
</div>

<div class="player-bar">
    <div class="player-inner">
        <div class="player-title idle" id="player-title">Select a mix to play</div>
        <div class="controls">
            <button class="ctrl-btn primary" id="btn-play" disabled title="Play/Pause">▶</button>
            <div class="progress-wrap">
                <div class="progress-bar-track" id="progress-track">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="time-row">
                    <span id="time-current">0:00</span>
                    <span id="time-total">--:--</span>
                </div>
            </div>
            <div class="volume-wrap">
                <span style="font-size:0.85rem;color:var(--muted)">🔊</span>
                <input type="range" id="volume" min="0" max="1" step="0.02" value="1">
            </div>
        </div>
        <div class="status-msg" id="status-msg"></div>
    </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
    const audio       = document.getElementById('audio');
    const playlist    = document.getElementById('playlist');
    const btnPlay     = document.getElementById('btn-play');
    const progressTrack = document.getElementById('progress-track');
    const progressFill  = document.getElementById('progress-fill');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal   = document.getElementById('time-total');
    const playerTitle = document.getElementById('player-title');
    const statusMsg   = document.getElementById('status-msg');
    const volumeSlider = document.getElementById('volume');

    let mixes = [];
    let currentIndex = null;

    function fmt(s) {
        if (!isFinite(s)) return '--:--';
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = Math.floor(s % 60);
        return h > 0
            ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
            : `${m}:${String(sec).padStart(2,'0')}`;
    }

    function setStatus(msg, isError = false) {
        statusMsg.textContent = msg;
        statusMsg.style.color = isError ? 'var(--error)' : 'var(--muted)';
    }

    function getCard(i) { return playlist.children[i]; }

    function setPlayIcon(playing) {
        btnPlay.textContent = playing ? '⏸' : '▶';
    }

    function buildPlaylist() {
        playlist.innerHTML = '';
        mixes.forEach((mix, i) => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.innerHTML = `
                <div class="play-btn">▶</div>
                <div class="track-info">
                    <h3>${mix.title}</h3>
                    <p>${mix.meta}</p>
                    ${mix.blurb ? `<div class="track-blurb">${mix.blurb}</div>` : ''}
                </div>
            `;
            card.addEventListener('click', () => {
                if (currentIndex === i) {
                    togglePlay();
                } else {
                    loadMix(i);
                }
            });
            playlist.appendChild(card);
        });
    }

    fetch('tracks.json')
        .then(r => r.json())
        .then(data => {
            mixes = data;
            buildPlaylist();
        })
        .catch(() => {
            setStatus('Failed to load tracks.json', true);
        });

    function loadMix(index) {
        if (currentIndex !== null) {
            getCard(currentIndex).classList.remove('active', 'error');
            getCard(currentIndex).querySelector('.play-btn').textContent = '▶';
        }

        currentIndex = index;
        const mix = mixes[index];
        const card = getCard(index);

        card.classList.add('active');
        card.querySelector('.play-btn').textContent = '⏸';

        playerTitle.textContent = mix.title;
        playerTitle.classList.remove('idle');

        progressFill.style.width = '0%';
        timeCurrent.textContent = '0:00';
        timeTotal.textContent = '--:--';
        btnPlay.disabled = true;
        setStatus('Loading…');

        audio.src = mix.streamUrl;
        audio.load();
        audio.play().catch(err => {
            setStatus(`Playback error: ${err.message}`, true);
            card.classList.add('error');
        });
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().catch(err => setStatus(`Playback error: ${err.message}`, true));
        } else {
            audio.pause();
        }
    }

    btnPlay.addEventListener('click', togglePlay);

    audio.addEventListener('canplay', () => {
        btnPlay.disabled = false;
        setStatus('');
    });

    audio.addEventListener('waiting', () => setStatus('Buffering…'));
    audio.addEventListener('playing', () => {
        setStatus('');
        setPlayIcon(true);
        if (currentIndex !== null) {
            getCard(currentIndex).querySelector('.play-btn').textContent = '⏸';
        }
    });

    audio.addEventListener('pause', () => {
        setPlayIcon(false);
        if (currentIndex !== null) {
            getCard(currentIndex).querySelector('.play-btn').textContent = '▶';
        }
    });

    audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
        timeCurrent.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener('durationchange', () => {
        timeTotal.textContent = fmt(audio.duration);
    });

    audio.addEventListener('error', () => {
        const codes = {1:'Aborted',2:'Network error',3:'Decode error',4:'Format not supported'};
        const msg = audio.error ? (codes[audio.error.code] || 'Unknown error') : 'Unknown error';
        setStatus(msg, true);
        btnPlay.disabled = true;
        if (currentIndex !== null) getCard(currentIndex).classList.add('error');
    });

    audio.addEventListener('ended', () => {
        setPlayIcon(false);
        progressFill.style.width = '100%';
        if (currentIndex !== null) {
            getCard(currentIndex).querySelector('.play-btn').textContent = '▶';
        }
    });

    // Seeking
    progressTrack.addEventListener('click', e => {
        if (!audio.duration) return;
        const rect = progressTrack.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
    });

    // Volume
    volumeSlider.addEventListener('input', () => {
        audio.volume = volumeSlider.value;
    });
</script>
</body>
</html>
